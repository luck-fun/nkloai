<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkloAI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Шапка приложения -->
    <header class="border-b border-gray-800 p-4 text-center text-xl font-bold bg-gray-950 flex items-center justify-center gap-2">
        <span class="w-3 h-3 bg-emerald-500 rounded-full inline-block"></span>
        <span>NkloAI Assistant</span>
    </header>

    <!-- Окно диалога -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl mx-auto w-full">
        <div class="bg-gray-800 p-4 rounded-xl max-w-[80%] self-start border border-gray-700 shadow-sm">
            Привет! Я ваш умный ассистент. Задайте вопрос или прикрепите изображение для анализа.
        </div>
    </div>

    <!-- Предпросмотр изображения -->
    <div id="image-preview-container" class="hidden max-w-3xl mx-auto w-full px-4 mb-2 flex items-center gap-3">
        <div class="relative">
            <img id="image-preview" class="h-16 w-16 object-cover rounded-lg border border-gray-600">
        </div>
        <button onclick="removeImage()" class="text-red-400 hover:text-red-300 text-sm font-medium">
            Удалить файл
        </button>
    </div>

    <!-- Форма ввода -->
    <footer class="p-4 bg-gray-950 border-t border-gray-800">
        <form id="chat-form" class="max-w-3xl mx-auto flex items-center gap-2">
            <label class="cursor-pointer p-2.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="previewImage(event)">
            </label>

            <input type="text" id="prompt-input" placeholder="Введите сообщение..." 
                   class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition-colors" required>

            <button type="submit" id="send-btn" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-lg font-medium transition-colors disabled:opacity-50">
                Отправить
            </button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('chat-form');
        const chatBox = document.getElementById('chat-box');
        const promptInput = document.getElementById('prompt-input');
        const imageInput = document.getElementById('image-input');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const sendBtn = document.getElementById('send-btn');

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                imagePreview.src = URL.createObjectURL(file);
                imagePreviewContainer.classList.remove('hidden');
            }
        }

        function removeImage() {
            imageInput.value = '';
            imagePreviewContainer.classList.add('hidden');
        }

        function appendMessage(sender, content, isHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' 
                ? 'bg-blue-700 p-4 rounded-xl max-w-[80%] ml-auto border border-blue-600 shadow-sm' 
                : 'bg-gray-800 p-4 rounded-xl max-w-[80%] mr-auto border border-gray-700 prose prose-invert max-w-none shadow-sm';
            
            if (isHtml) {
                msgDiv.innerHTML = content;
            } else {
                msgDiv.textContent = content;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt);
            
            const formData = new FormData();
            formData.append('prompt', prompt);
            if (imageInput.files[0]) {
                formData.append('image', imageInput.files[0]);
            }

            promptInput.value = '';
            removeImage();
            
            sendBtn.disabled = true;
            const loadingMsg = appendMessage('bot', '<span class="animate-pulse">Генерация ответа...</span>', true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok) {
                    loadingMsg.innerHTML = marked.parse(data.response);
                } else {
                    loadingMsg.textContent = 'Ошибка: ' + (data.detail || 'Не удалось получить ответ');
                }
            } catch (err) {
                loadingMsg.textContent = 'Ошибка соединения с сервером.';
            } finally {
                sendBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
